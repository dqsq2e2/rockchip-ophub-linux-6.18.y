# eth0/eth1 are DSA master (CPU conduit) interfaces and must not get an
# IP. Only the switch user ports (eth2..eth11) should obtain DHCP.
denyinterfaces br0 lo eth0 eth1
allowinterfaces eth2 eth3 eth4 eth5 eth6 eth7 eth8 eth9 eth10 eth11
duid
noipv4ll
# releaseonexit
option domain_name_servers, domain_name, domain_search
option static_routes, classless_static_routes
option interface_mtu
option host_name
require dhcp_server_identifier
vendorclassid
slaac private
reboot 5
# retry 10
timeout 30
ipv6ra_noautoconf
noipv6

