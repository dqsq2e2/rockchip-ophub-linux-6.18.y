# eth1/br0 已移除（PCIe 网卡禁用，eth1 不存在）。
# 仅排除 lo，eth0 由 dhcpcd 管理 (DHCP client)。
denyinterfaces lo
allowinterfaces eth0
duid
noipv4ll
# releaseonexit
option domain_name_servers, domain_name, domain_search
option static_routes, classless_static_routes
option interface_mtu
option host_name
require dhcp_server_identifier
vendorclassid
slaac private
reboot 5
# retry 10
timeout 30
ipv6ra_noautoconf
noipv6

