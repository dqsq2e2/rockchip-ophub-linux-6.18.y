DEFAULT recovery
TIMEOUT 20
MENU TITLE PHX-R3588 Recovery

LABEL recovery
    MENU LABEL PHX-R3588 Recovery
    LINUX /Image
    INITRD /initramfs.cpio.gz
    FDT /dtb/rockchip/rk3588-phx-r3588.dtb
    APPEND rdinit=/init console=ttyS2,115200n8 consoleblank=0 earlycon=uart8250,mmio32,0xfeb50000 loglevel=5 cma=128M
